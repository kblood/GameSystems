<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameSystems · Flaskedemo WebXR</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101619'/%3E%3Cpath d='M13 5h6v8l4 4v10H9V17l4-4z' fill='%23668187'/%3E%3Cpath d='M11 20h10v5H11z' fill='%23f7c880'/%3E%3C/svg%3E" />
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #f4e9d8; background: #101619; }
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #top { position: absolute; top: 16px; left: 16px; width: min(420px, calc(100vw - 32px)); background: #111b20de; border: 1px solid #72909277; border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px #0007; }
    h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: .02em; }
    p { margin: 5px 0; line-height: 1.45; font-size: 12px; color: #d6d7d0; }
    #status { color: #f7c880; }
    #controls { pointer-events: auto; display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
    button, select { background: #26373b; color: #f6eadb; border: 1px solid #668187; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
    button:hover, select:hover { background: #395059; }
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-shadow: 0 0 4px #000; font-size: 18px; }
    #hint { position: absolute; bottom: 12px; left: 16px; right: 16px; color: #e8ded0; text-shadow: 0 1px 4px #000; font-size: 12px; }
    #toast { position: absolute; top: 35%; left: 50%; transform: translateX(-50%); border-radius: 8px; padding: 8px 12px; background: #10191de8; opacity: 0; transition: opacity .25s; }
    #toast.visible { opacity: 1; }
    @media (max-width: 680px) { #top { font-size: 11px; } #hint { display: none; } }
  </style>
</head>
<body>
  <div id="hud">
    <section id="top">
      <h1>Flaskedemo · WebXR</h1>
      <p id="status">Indlæser scene…</p>
      <div id="controls">
        <button id="enter-xr">Gå i VR</button>
        <button id="reset">Nulstil</button>
        <button id="pause">Pause</button>
        <select id="quality" aria-label="Kvalitet"><option value="3">Høj</option><option value="2">Mellem</option><option value="1">Lav</option><option value="0">Minimal</option></select>
      </div>
    </section>
    <div id="crosshair">+</div>
    <div id="toast"></div>
    <div id="hint">Klik for at styre · WASD flyt · mus sigt · G grib/slip · Q pistol (hylster) · hjul eller Z/X vip · U låg · E kast · venstre klik skyd · R nulstil · 1–4 kvalitet · P pause · Esc frigør mus</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
